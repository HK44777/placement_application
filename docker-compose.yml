version: '3.8'

services:
  web:
    # ✅ CHANGED: No longer builds from local Dockerfile on EC2.
    # Instead, pulls the pre-built image from AWS ECR (built by GitHub Actions).
    # Reason: docker build on EC2 was consuming all RAM/CPU credits and taking 30+ minutes.
    image: 070223343756.dkr.ecr.eu-north-1.amazonaws.com/placment-backend:latest
    container_name: web_api
    working_dir: /app/backend_placement
    command: uvicorn app:app --host 0.0.0.0 --port 5000 
    ports:
      - "80:5000"
    env_file:
      - .env
    depends_on:
      - redis
    restart: always

  redis:
    # Redis uses the official image directly from Docker Hub — no change needed.
    image: redis:alpine
    container_name: redis_broker
    ports:
      - "6379:6379"
    restart: always

  celery_worker:
    # ✅ CHANGED: Same ECR image as web. All 3 backend services share one image
    # because they all use the same Dockerfile (same Python environment).
    image: 070223343756.dkr.ecr.eu-north-1.amazonaws.com/placment-backend:latest
    container_name: celery_worker
    working_dir: /app/backend_placement
    command: celery -A celery_app.celery worker --loglevel=info
    env_file:
      - .env
    depends_on:
      - redis
    restart: always

  celery_beat:
    # ✅ CHANGED: Same ECR image — different command, same image.
    image: 070223343756.dkr.ecr.eu-north-1.amazonaws.com/placment-backend:latest
    container_name: celery_beat
    working_dir: /app/backend_placement
    command: celery -A celery_app.celery beat --loglevel=info
    env_file:
      - .env
    depends_on:
      - redis
    restart: always
